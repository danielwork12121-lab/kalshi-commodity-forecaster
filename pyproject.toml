[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-forecast"
version = "0.6.2"
description = "Calibrated commodity-price forecasting and threshold-probability estimates, built on conformal-forecast."
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "xlrd>=2.0",
    "conformal-forecast @ git+https://github.com/danielwork12121-lab/conformal-forecast.git",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["commodity_forecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
